name: Static site validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate index.html exists
        run: test -s index.html
      - name: Check basic HTML structure
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const checks = [
            ['doctype', /<!doctype html>/i],
            ['html lang', /<html[^>]*lang=/i],
            ['viewport', /<meta[^>]*name=["']viewport["']/i],
            ['title', /<title>[^<]+<\/title>/i],
            ['closing html', /<\/html>\s*$/i],
          ];
          let failed = false;
          for (const [name, re] of checks) {
            const ok = re.test(html);
            console.log((ok ? 'PASS' : 'FAIL') + ' ' + name);
            if (!ok) failed = true;
          }
          if (failed) process.exit(1);
          NODE
