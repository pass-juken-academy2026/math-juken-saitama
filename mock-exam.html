<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173b72"><title>数学 模擬試験｜数学攻略室</title>
<style>
:root{--navy:#173b72;--blue:#2463eb;--sky:#eef5ff;--ink:#172033;--muted:#64748b;--line:#dbe4f0;--bg:#f5f7fb;--green:#087f5b;--orange:#b45309}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.7}button,input,select{font:inherit}button,a{cursor:pointer}.top{background:var(--navy);color:#fff;padding:15px max(18px,calc((100vw - 1120px)/2));display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}.brand{font-weight:900;font-size:18px}.nav{display:flex;gap:7px;flex-wrap:wrap}.nav a{color:white;text-decoration:none;padding:6px 10px;border-radius:8px;background:#ffffff18;font-size:13px}.nav a.active,.nav a:hover{background:#fff;color:var(--navy)}main{max-width:1120px;margin:auto;padding:28px 18px 60px}.hero{background:linear-gradient(120deg,#173b72,#2463eb);color:#fff;border-radius:20px;padding:25px 28px;margin-bottom:22px}.hero .eyebrow{font-size:12px;letter-spacing:.12em;font-weight:800;opacity:.8}.hero h1{margin:5px 0;font-size:clamp(26px,4vw,36px)}.hero p{margin:8px 0 0;max-width:850px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px;margin-bottom:14px;box-shadow:0 4px 15px #15294a08}.card h2,.card h3{margin-top:0}.muted{color:var(--muted)}.tag{display:inline-block;background:var(--sky);color:var(--blue);font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px}.formula{font-size:20px;font-weight:850;color:var(--navy);background:#f1f6ff;border-radius:10px;padding:12px;margin:10px 0}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0}.toolbar input,.toolbar select,input.answer{border:1px solid #cbd5e1;border-radius:10px;padding:10px 12px;background:#fff;min-width:170px}.btn{border:0;border-radius:10px;padding:10px 15px;background:var(--blue);color:#fff;font-weight:800}.btn.secondary{background:#eaf1fb;color:var(--navy)}.btn:disabled{opacity:.4;cursor:not-allowed}.question{font-size:20px;font-weight:800;margin:18px 0}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:9px}.choice{background:#fff;border:1px solid var(--line);padding:12px;border-radius:10px;text-align:left}.choice:hover{border-color:var(--blue);background:var(--sky)}.feedback{padding:12px;border-radius:10px;margin-top:12px;display:none}.feedback.show{display:block;background:#effaf5;border:1px solid #a7e1c5}.progress{height:8px;background:#e4eaf3;border-radius:99px;overflow:hidden}.progress span{display:block;height:100%;background:var(--blue);width:0}.item{border-top:1px solid var(--line);padding:15px 0}.item:first-child{border-top:0}.item h3{margin:0 0 5px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:700px){.two{grid-template-columns:1fr}.top{align-items:flex-start}.hero{padding:20px}}
</style></head><body><header class="top"><div class="brand">∑ 数学攻略室</div><nav class="nav"><a href="index.html">ホーム</a><a href="timeline.html" >学習ロードマップ</a><a href="connections.html" >公式のつながり</a><a href="causes.html" >解法パターン</a><a href="quiz.html" >一問一答</a><a href="mock-exam.html" class="active">模擬試験</a></nav></header><main><section class="hero"><div class="eyebrow">JUNIOR HIGH SCHOOL MATH · ENTRANCE EXAM</div><h1>数学 模擬試験</h1><p>出題数を選んで、計算・関数・図形・確率などの総合演習に挑戦。採点後に復習方針を確認。</p></section><div class="card"><div class="toolbar"><label>出題数 <select id="count"><option value="10">10問・短時間</option><option value="15" selected>15問・標準</option><option value="20">20問・実力確認</option></select></label><button id="start" class="btn">模擬試験を開始</button></div><p class="muted">オリジナル問題による練習用模試です。実際の都道府県の過去問そのものではありません。紙に途中式を書き、時間を決めて解こう。</p></div><div class="card" id="exam" hidden><div class="progress"><span id="bar"></span></div><p id="counter" class="muted"></p><div id="question" class="question"></div><div id="choices" class="choices"></div><div id="feedback" class="feedback"></div><div class="toolbar"><button id="next" class="btn" disabled>次の問題 →</button></div></div><div class="card" id="result" hidden></div></main><script>const data=[["正負の数","−8+13","5",["−21","−5","5","21"],"異符号なので絶対値の差。大きい方の符号をつける。"],["展開","(x+2)(x+5)","x²+7x+10",["x²+10x+7","x²+7x+10","x²+3x+10","x²+7x−10"],"分配法則で4項を計算して同類項をまとめる。"],["因数分解","x²−9x+20","(x−4)(x−5)",["(x−2)(x−10)","(x+4)(x+5)","(x−4)(x−5)","(x−1)(x−20)"],"積20、和−9となる−4と−5。"],["平方根","√72を簡単に","6√2",["3√8","6√2","8√3","12√6"],"√72=√(36×2)。"],["一次方程式","5x−4=21","5",["3","4","5","6"],"5x=25。"],["連立方程式","x+y=10、x−y=2のx","6",["4","5","6","8"],"足すと2x=12。"],["二次方程式","x²−4x=0の解","0,4",["−4,0","0,4","1,4","0,−4"],"x(x−4)=0。"],["一次関数","傾き2、切片−3の式","y=2x−3",["y=−3x+2","y=2x+3","y=2x−3","y=−2x−3"],"y=ax+bに代入。"],["一次関数","y=−x+6とx軸の交点のx座標","6",["−6","0","1","6"],"x軸上はy=0。"],["二次関数","y=ax²が(3,18)を通る。aは？","2",["2","3","6","9"],"18=9a。"],["角度","三角形の角が35°、85°。残り","60°",["50°","60°","70°","80°"],"180−35−85=60。"],["相似","相似比2:3の面積比","4:9",["2:3","4:9","8:27","9:4"],"長さの比を2乗。"],["三平方","直角辺が9、12。斜辺","15",["13","14","15","21"],"81+144=225。"],["確率","さいころで5以上が出る確率","1/3",["1/6","1/2","1/3","2/3"],"5,6の2通り/6通り。"],["データ","3,5,5,7,10の中央値","5",["3","5","6","7"],"真ん中の3番目の値。"],["空間図形","底面積8、高さ7の柱体の体積","56",["15","49","56","64"],"底面積×高さ。"],["多角形","六角形の内角の和","720°",["540°","600°","720°","900°"],"180×(6−2)。"],["確率","硬貨を3回投げる全結果数","8",["3","6","8","9"],"2×2×2=8。"],["平均","4,6,8,10の平均","7",["6","7","8","28"],"合計28を4で割る。"],["文章題","時速60kmで2.5時間進む距離","150km",["24km","120km","150km","180km"],"距離=速さ×時間。"]];let pool=[],i=0,score=0,done=false;const $=s=>document.querySelector(s);$('#start').onclick=()=>{pool=data.slice(0,Number($('#count').value));i=0;score=0;done=false;$('#exam').hidden=false;$('#result').hidden=true;paint()};function paint(){done=false;$('#counter').textContent='問題 '+(i+1)+' / '+pool.length+'　｜ '+pool[i][0];$('#bar').style.width=(i/pool.length*100)+'%';$('#question').textContent=pool[i][1];$('#choices').innerHTML=pool[i][3].map(v=>'<button class="choice">'+v+'</button>').join('');$('#feedback').className='feedback';$('#feedback').textContent='';$('#next').disabled=true;[...$('#choices').children].forEach(b=>b.onclick=()=>ans(b.textContent))}function ans(v){if(done)return;done=true;let q=pool[i],ok=v===q[2];if(ok)score++;$('#feedback').className='feedback show';$('#feedback').innerHTML=(ok?'正解！':'正解：'+q[2])+'<br>'+q[4];$('#next').disabled=false;$('#bar').style.width=((i+1)/pool.length*100)+'%'}$('#next').onclick=()=>{if(i+1<pool.length){i++;paint()}else{$('#exam').hidden=true;$('#result').hidden=false;$('#result').innerHTML='<h2>模擬試験 結果</h2><p class="formula">'+score+' / '+pool.length+' 問正解（'+Math.round(score/pool.length*100)+'%）</p><p>'+(score/pool.length>=.8?'いい調子！応用問題にも挑戦しよう。':score/pool.length>=.5?'あと一歩！間違えた単元を復習してもう一度。':'公式・解法一覧から基礎を固めて再挑戦しよう。')+'</p><button class="btn" onclick="document.querySelector(\'#start\').click()">もう一度受験</button>';}};</script></body></html>
