<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173b72"><title>数学一問一答｜数学攻略室</title>
<style>
:root{--navy:#173b72;--blue:#2463eb;--sky:#eef5ff;--ink:#172033;--muted:#64748b;--line:#dbe4f0;--bg:#f5f7fb;--green:#087f5b;--orange:#b45309}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.7}button,input,select{font:inherit}button,a{cursor:pointer}.top{background:var(--navy);color:#fff;padding:15px max(18px,calc((100vw - 1120px)/2));display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}.brand{font-weight:900;font-size:18px}.nav{display:flex;gap:7px;flex-wrap:wrap}.nav a{color:white;text-decoration:none;padding:6px 10px;border-radius:8px;background:#ffffff18;font-size:13px}.nav a.active,.nav a:hover{background:#fff;color:var(--navy)}main{max-width:1120px;margin:auto;padding:28px 18px 60px}.hero{background:linear-gradient(120deg,#173b72,#2463eb);color:#fff;border-radius:20px;padding:25px 28px;margin-bottom:22px}.hero .eyebrow{font-size:12px;letter-spacing:.12em;font-weight:800;opacity:.8}.hero h1{margin:5px 0;font-size:clamp(26px,4vw,36px)}.hero p{margin:8px 0 0;max-width:850px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px;margin-bottom:14px;box-shadow:0 4px 15px #15294a08}.card h2,.card h3{margin-top:0}.muted{color:var(--muted)}.tag{display:inline-block;background:var(--sky);color:var(--blue);font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px}.formula{font-size:20px;font-weight:850;color:var(--navy);background:#f1f6ff;border-radius:10px;padding:12px;margin:10px 0}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0}.toolbar input,.toolbar select,input.answer{border:1px solid #cbd5e1;border-radius:10px;padding:10px 12px;background:#fff;min-width:170px}.btn{border:0;border-radius:10px;padding:10px 15px;background:var(--blue);color:#fff;font-weight:800}.btn.secondary{background:#eaf1fb;color:var(--navy)}.btn:disabled{opacity:.4;cursor:not-allowed}.question{font-size:20px;font-weight:800;margin:18px 0}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:9px}.choice{background:#fff;border:1px solid var(--line);padding:12px;border-radius:10px;text-align:left}.choice:hover{border-color:var(--blue);background:var(--sky)}.feedback{padding:12px;border-radius:10px;margin-top:12px;display:none}.feedback.show{display:block;background:#effaf5;border:1px solid #a7e1c5}.progress{height:8px;background:#e4eaf3;border-radius:99px;overflow:hidden}.progress span{display:block;height:100%;background:var(--blue);width:0}.item{border-top:1px solid var(--line);padding:15px 0}.item:first-child{border-top:0}.item h3{margin:0 0 5px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:700px){.two{grid-template-columns:1fr}.top{align-items:flex-start}.hero{padding:20px}}
</style></head><body><header class="top"><div class="brand">∑ 数学攻略室</div><nav class="nav"><a href="index.html">ホーム</a><a href="timeline.html" >学習ロードマップ</a><a href="connections.html" >公式のつながり</a><a href="causes.html" >解法パターン</a><a href="quiz.html" class="active">一問一答</a><a href="mock-exam.html" >模擬試験</a></nav></header><main><section class="hero"><div class="eyebrow">JUNIOR HIGH SCHOOL MATH · ENTRANCE EXAM</div><h1>数学一問一答</h1><p>全30問の分野別クイズ。正誤判定と解説つきで、苦手な分野を見つけよう。</p></section><div class="card"><div class="toolbar"><label>分野 <select id="topic"><option value="all">すべて</option><option>計算</option><option>方程式</option><option>関数</option><option>図形</option><option>確率・データ</option></select></label></div><div class="progress"><span id="bar"></span></div><p id="counter" class="muted"></p><div id="question" class="question"></div><div id="choices" class="choices"></div><div id="feedback" class="feedback"></div><div class="toolbar"><button id="next" class="btn" disabled>次の問題 →</button><button id="restart" class="btn secondary">最初から</button></div><p id="score" class="muted"></p></div></main><script>const data=[["計算","−7+12","5",["−19","5","−5","19"],"異符号の足し算は絶対値の差。大きい方の符号をつける。"],["計算","3(2x−5)を展開","6x−15",["6x−5","5x−15","6x−15","6x+15"],"3を2xと−5の両方に掛ける。"],["計算","(x+4)²を展開","x²+8x+16",["x²+16","x²+4x+16","x²+8x+16","x²−8x+16"],"(a+b)²=a²+2ab+b²。"],["計算","x²−25を因数分解","(x+5)(x−5)",["(x−5)²","(x+5)(x−5)","(x+25)(x−1)","因数分解できない"],"和と差の積 a²−b²=(a+b)(a−b)。"],["計算","√50を簡単にする","5√2",["25√2","5√2","10√5","√25"],"√50=√(25×2)=5√2。"],["方程式","4x−7=13 の解","5",["4","5","6","−5"],"4x=20なのでx=5。"],["方程式","x+y=9、x−y=3 のx","6",["3","4","6","9"],"2式を足して2x=12。"],["方程式","x²−7x+12=0 の解の組","3,4",["2,6","3,4","−3,−4","1,12"],"(x−3)(x−4)=0。"],["関数","y=−2x+5 の傾き","−2",["5","2","−2","−5"],"y=ax+bのaが傾き。"],["関数","y=3x−1でx=2のときのy","5",["4","5","6","7"],"3×2−1=5。"],["関数","(1,2),(3,8)を通る直線の傾き","3",["2","3","4","6"],"(8−2)/(3−1)=3。"],["関数","y=ax²が(2,12)を通るときa","3",["2","3","4","6"],"12=4aだからa=3。"],["図形","三角形の2角が45°と65°。残りの角","70°",["60°","70°","80°","90°"],"内角の和は180°。"],["図形","相似比2:5の面積比","4:25",["2:5","4:25","8:125","5:2"],"面積比は相似比の2乗。"],["図形","直角をはさむ辺が6と8。斜辺","10",["12","14","10","7"],"36+64=100、√100=10。"],["図形","五角形の内角の和","540°",["360°","450°","540°","720°"],"180°×(5−2)=540°。"],["確率・データ","公平なさいころで3以下の確率","1/2",["1/3","1/2","2/3","1/6"],"1,2,3の3通り/6通り。"],["確率・データ","2,4,9の中央値","4",["2","4","5","9"],"小さい順に並んでいるので真ん中は4。"],["確率・データ","2,4,6,8の平均","5",["4","5","6","20"],"合計20÷4=5。"],["確率・データ","硬貨を2回投げる全結果の数","4",["2","3","4","6"],"表表・表裏・裏表・裏裏の4通り。"],["計算","(x+3)(x−3)を展開","x²−9",["x²−6x+9","x²+9","x²−9","x²−3"],"和と差の積。"],["方程式","2(x−4)=10の解","9",["1","5","9","14"],"両辺を2で割るとx−4=5。"],["関数","比例y=4xでx=−3のときy","−12",["12","−7","−12","−1"],"y=4×(−3)。"],["図形","相似比3:4の体積比","27:64",["3:4","9:16","27:64","81:256"],"体積比は相似比の3乗。"],["確率・データ","データ1,2,2,3,7の最頻値","2",["1","2","3","7"],"最も多く出る値は2。"],["計算","√12×√3","6",["3","6","√15","36"],"√36=6。"],["方程式","3x+2=2x+9の解","7",["−7","5","7","9"],"xを片側、定数を反対側へ。"],["関数","一次関数の切片はx=0のときの何？","yの値",["xの値","yの値","傾き","交点の数"],"y=ax+bでx=0ならy=b。"],["図形","平行四辺形の向かい合う辺","等しい",["垂直","等しい","必ず違う","直角"],"平行四辺形の対辺は平行で長さが等しい。"],["確率・データ","範囲の求め方","最大値−最小値",["最大値+最小値","最大値−最小値","平均÷個数","中央値×2"],"データの範囲は最大値から最小値を引く。"]];let pool=data.slice(),i=0,score=0,answered=false;const $=s=>document.querySelector(s);function setup(){const topic=$('#topic').value;pool=data.filter(x=>topic==='all'||x[0]===topic);i=0;score=0;paint()}function paint(){answered=false;$('#counter').textContent='問題 '+(i+1)+' / '+pool.length;$('#bar').style.width=(i/pool.length*100)+'%';$('#question').textContent=pool[i][1];$('#choices').innerHTML=pool[i][3].map(v=>'<button class="choice">'+v+'</button>').join('');$('#feedback').className='feedback';$('#feedback').textContent='';$('#next').disabled=true;$('#score').textContent='正解 '+score+' 問';[...$('#choices').children].forEach(b=>b.onclick=()=>answer(b.textContent));}function answer(v){if(answered)return;answered=true;const q=pool[i],ok=v===q[2];if(ok)score++;$('#feedback').className='feedback show';$('#feedback').innerHTML=(ok?'正解！':'正解は「'+q[2]+'」')+'<br>'+q[4];$('#next').disabled=false;$('#bar').style.width=((i+1)/pool.length*100)+'%';$('#score').textContent='正解 '+score+' / '+(i+1)+' 問';}$('#next').onclick=()=>{if(i<pool.length-1){i++;paint()}else{$('#question').textContent='演習終了！';$('#choices').innerHTML='';$('#feedback').className='feedback show';$('#feedback').textContent='結果：'+score+' / '+pool.length+' 問正解。間違えた分野を公式・解法一覧で復習しよう。';$('#next').disabled=true;$('#bar').style.width='100%';}};$('#restart').onclick=setup;$('#topic').onchange=setup;setup();</script></body></html>
