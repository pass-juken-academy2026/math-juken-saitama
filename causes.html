<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173b72"><title>解法パターン図鑑｜数学攻略室</title>
<style>
:root{--navy:#173b72;--blue:#2463eb;--sky:#eef5ff;--ink:#172033;--muted:#64748b;--line:#dbe4f0;--bg:#f5f7fb;--green:#087f5b;--orange:#b45309}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.7}button,input,select{font:inherit}button,a{cursor:pointer}.top{background:var(--navy);color:#fff;padding:15px max(18px,calc((100vw - 1120px)/2));display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}.brand{font-weight:900;font-size:18px}.nav{display:flex;gap:7px;flex-wrap:wrap}.nav a{color:white;text-decoration:none;padding:6px 10px;border-radius:8px;background:#ffffff18;font-size:13px}.nav a.active,.nav a:hover{background:#fff;color:var(--navy)}main{max-width:1120px;margin:auto;padding:28px 18px 60px}.hero{background:linear-gradient(120deg,#173b72,#2463eb);color:#fff;border-radius:20px;padding:25px 28px;margin-bottom:22px}.hero .eyebrow{font-size:12px;letter-spacing:.12em;font-weight:800;opacity:.8}.hero h1{margin:5px 0;font-size:clamp(26px,4vw,36px)}.hero p{margin:8px 0 0;max-width:850px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px;margin-bottom:14px;box-shadow:0 4px 15px #15294a08}.card h2,.card h3{margin-top:0}.muted{color:var(--muted)}.tag{display:inline-block;background:var(--sky);color:var(--blue);font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px}.formula{font-size:20px;font-weight:850;color:var(--navy);background:#f1f6ff;border-radius:10px;padding:12px;margin:10px 0}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0}.toolbar input,.toolbar select,input.answer{border:1px solid #cbd5e1;border-radius:10px;padding:10px 12px;background:#fff;min-width:170px}.btn{border:0;border-radius:10px;padding:10px 15px;background:var(--blue);color:#fff;font-weight:800}.btn.secondary{background:#eaf1fb;color:var(--navy)}.btn:disabled{opacity:.4;cursor:not-allowed}.question{font-size:20px;font-weight:800;margin:18px 0}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:9px}.choice{background:#fff;border:1px solid var(--line);padding:12px;border-radius:10px;text-align:left}.choice:hover{border-color:var(--blue);background:var(--sky)}.feedback{padding:12px;border-radius:10px;margin-top:12px;display:none}.feedback.show{display:block;background:#effaf5;border:1px solid #a7e1c5}.progress{height:8px;background:#e4eaf3;border-radius:99px;overflow:hidden}.progress span{display:block;height:100%;background:var(--blue);width:0}.item{border-top:1px solid var(--line);padding:15px 0}.item:first-child{border-top:0}.item h3{margin:0 0 5px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:700px){.two{grid-template-columns:1fr}.top{align-items:flex-start}.hero{padding:20px}}
</style></head><body><header class="top"><div class="brand">∑ 数学攻略室</div><nav class="nav"><a href="index.html">ホーム</a><a href="timeline.html" >学習ロードマップ</a><a href="connections.html" >公式のつながり</a><a href="causes.html" class="active">解法パターン</a><a href="quiz.html" >一問一答</a><a href="mock-exam.html" >模擬試験</a></nav></header><main><section class="hero"><div class="eyebrow">JUNIOR HIGH SCHOOL MATH · ENTRANCE EXAM</div><h1>解法パターン図鑑</h1><p>問題文の条件から解法を選ぶ練習。入試でよく使う考え方を、検索・レベル別に整理。</p></section><p class="muted">入試問題は、問題文の数字だけを見るより「何を求めるか」「どんな条件があるか」で解法を選ぶのがコツ。検索して、似たパターンを確認しよう。</p><div class="toolbar"><input id="search" placeholder="例：速さ、交点、相似"><select id="level"><option value="all">すべてのレベル</option><option>基礎</option><option>標準</option><option>応用</option></select></div><div id="list"></div></main><script>const data=[["計算","基礎","かっこを含む式","分配法則でかっこを外し、同類項をまとめる。","−3(x−2)なら−3x+6。外のマイナスを各項に掛ける。"],["計算","標準","因数分解できる二次式","積と和の組を探し、(x+a)(x+b)の形にする。","x²+5x+6なら、積6・和5の2と3を使う。"],["方程式","基礎","文章題で数量を求める","求めたい数量をxと置き、問題文の関係を等式にする。","答えが出たら、単位と問題文の条件に合うか確認。"],["方程式","標準","2つの数量がある文章題","数量をx,yと置き、異なる条件から式を2本作る。","個数と代金、速さと時間などを表に整理する。"],["関数","標準","2点を通る一次関数","まず傾きa=(yの差)/(xの差)、次にy=ax+bへ点を代入。","傾きの分子と分母は同じ順序で引く。"],["関数","応用","2つのグラフの交点","2つの式のyを等しくしてxを求め、どちらかの式に代入。","交点は両方の式を同時に満たす点。"],["関数","応用","二次関数の変化の割合","2点の座標を式に代入してyを求め、増加量の比を取る。","二次関数では区間によって変化の割合が変わる。"],["図形","標準","相似を使う長さ","対応する頂点をそろえ、対応する辺の比を等しくする。","対応順をずらさない。平行線が比を作る手がかり。"],["図形","応用","証明問題","仮定から分かることを書き、合同・相似条件を示し、結論につなぐ。","図から見た目だけで判断せず、根拠を文章にする。"],["図形","標準","直角三角形の辺","斜辺を確認し、三平方の定理を使う。","斜辺は最も長く、直角の向かい側。"],["確率","標準","複数回の試行","樹形図や表で全結果を整理してから、有利な結果を数える。","同じ結果を重複して数えない。"],["データ","基礎","中央値・四分位数","データを小さい順に並べ、真ん中と上下半分の中央値を取る。","偶数個の場合は中央2値の平均。"]];const list=document.querySelector('#list');function draw(){let q=document.querySelector('#search').value.toLowerCase(),g=document.querySelector('#level').value;list.innerHTML=data.filter(x=>(g==='all'||x[1]===g)&&x.join(' ').toLowerCase().includes(q)).map(x=>'<article class="card"><span class="tag">'+x[0]+' · '+x[1]+'</span><h2>'+x[2]+'</h2><p><b>考え方：</b>'+x[3]+'</p><p class="muted"><b>例・注意：</b>'+x[4]+'</p></article>').join('')||'<p>該当するパターンがありません。</p>'}document.querySelector('#search').addEventListener('input',draw);document.querySelector('#level').addEventListener('change',draw);draw();</script></body></html>
